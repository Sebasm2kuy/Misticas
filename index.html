<!DOCTYPE html>
<!--
  ============================================================
   M I S T I C A S   —  (C) 1987 — "El juego maldito"
   Fase 1: EL INICIO
   Ficción sonora original: "Místicas" de Manuel Bartual
   y Carmen Pacheco. Fan game no oficial y sin ánimo de lucro.
   100% autocontenido: sin dependencias, sin build, sin CDN.
   Listo para GitHub Pages.
  ============================================================
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>MÍSTICAS (1987) — El juego maldito</title>
  <meta name="description" content="Versión jugable retro de Místicas, la ficción sonora de Manuel Bartual y Carmen Pacheco. Un título de culto de 1987 que nunca debió existir.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="crt" role="img" aria-label="MÍSTICAS, juego de terror retro de 1987">
    <canvas id="game" width="320" height="240"></canvas>
    <div id="roll"></div>
    <div id="scan"></div>
    <div id="grille"></div>
    <div id="vig"></div>
    <div id="flick"></div>
  </div>

  <!-- Controles táctiles: viven en el negro del letterbox, nunca
       sobre el tubo ni sobre el HUD. Arriba PAUSA y AUDIO; abajo,
       a la izquierda el JOYSTICK FLOTANTE analógico (sustituye a la
       cruceta) y a la derecha FUEGO. main.js los recoloca tras cada
       redimensionado midiendo el tubo real. -->
  <div id="touch">
    <!-- Botones de sistema: pausa y audio, siempre accesibles -->
    <div class="tbtn tsys" data-k="pause" id="t-pause" role="button" aria-label="Pausa">II</div>
    <div class="tbtn tsys" data-k="mute"  id="t-audio" role="button" aria-label="Silenciar audio">&#9834;</div>
    <!-- Joystick táctil flotante: bola translúcida que se arrastra.
         input.js convierte el vector del dedo a la rejilla isométrica. -->
    <div id="joy" role="button" aria-label="Joystick de movimiento">
      <div id="joy-knob"></div>
    </div>
    <!-- Botón de acción -->
    <div class="tbtn" data-k="fire" id="t-fire" role="button" aria-label="Acción">&#9679;</div>
  </div>

  <!-- Orden de carga: núcleo primero, escenas al final -->
  <script src="js/config.js"></script>
  <script src="js/font.js"></script>
  <script src="js/input.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/iso.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/world.js"></script>
  <script src="js/scenes/boot.js"></script>
  <script src="js/scenes/title.js"></script>
  <script src="js/scenes/tree.js"></script>
  <script src="js/scenes/cemetery.js"></script>
  <script src="js/scenes/conventext.js"></script>
  <script src="js/scenes/convent.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
